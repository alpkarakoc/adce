# Native x86_64 verification.
#
# The gap this closes is recorded in CLAUDE.md: "no real x86_64 hardware has run
# this code." Every green result before this workflow came from native arm64 or
# from qemu-emulated amd64, and emulation proves compilation and test outcomes
# while proving nothing about timing or memory-model behaviour. x86_64 is where
# the seqlock actually ships.
#
# Neither gate script is modified to run here. verify.sh already honours CC, and
# the only CI-specific need -- binfmt registration so the shipping-target gate
# can still reach linux/arm64 from an x86_64 host -- is a workflow step. A gate
# change would have to be proposed on its own, per CLAUDE.md.

name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly, because repeated execution is what finds the bugs this project
  # actually has. The phase race in the harness survived four green runs and
  # surfaced only when a 2-core runner widened the window; TSan could not have
  # caught it, since a phase-accounting race is not a data race. Sampling the
  # scheduler repeatedly is the mechanism that works on that class.
  #
  # Off the hour on purpose: GitHub queues scheduled workflows hardest at :00,
  # and a nightly that starts late is a nightly whose result arrives late.
  schedule:
    - cron: "17 4 * * *"

# A superseded push should not keep burning a runner; the newest commit is the
# only one whose result anyone acts on.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sanitizers:
    # Both architectures, identical steps, so any divergence between them is
    # attributable to the machine rather than to the workflow.
    #
    # arm64 is not a nice-to-have second opinion here, it is the STRICTER test.
    # CLAUDE.md makes the local target the host architecture precisely because
    # x86_64's TSO hides missing barriers that a weakly-ordered target exposes:
    # code that passes on arm64 passes on x86_64, and the reverse does not hold.
    # That made arm64 the authoritative concurrency evidence in this project
    # while it ran on exactly one laptop. The qemu arm64 leg in
    # verify-linux-gcc.sh does not substitute for it -- emulation proves
    # compilation, not memory ordering.
    #
    # Both images pinned, not ubuntu-latest. A gate whose toolchain moves under
    # it stops meaning what it meant, and this one is load-bearing evidence
    # about a memory model.
    strategy:
      # The whole point is comparing the two, so one going red must not cancel
      # the other and destroy the comparison.
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # These runners default vm.mmap_rnd_bits high enough that LLVM's
      # sanitizer runtimes cannot map their shadow regions against that much
      # ASLR entropy, and abort at startup before a single test runs. Lowering
      # it is the standard workaround and affects only this runner's entropy,
      # not the code under test. Deliberately not tolerated with `|| true`: a
      # sysctl that silently fails would leave the sanitizers to abort later
      # with a much less obvious message.
      - name: Widen sanitizer address space
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      # Recorded before the gate runs, so a green result is attributable to a
      # named toolchain rather than to whatever the image happened to carry.
      # The two runners need not ship the same clang, and if they diverge that
      # is worth seeing rather than assuming parity.
      - name: Toolchain
        run: |
          uname -srm
          cc --version | head -1
          clang --version | head -1
          echo "nproc: $(nproc)"

      # CC=clang deliberately. verify.sh is the sanitizer gate and runs clang
      # locally on macOS, so keeping clang here means the CI result and the
      # local result are the same gate on a different machine, rather than two
      # different gates. GCC is covered by the shipping-target job below.
      #
      # On the arm64 runner this is TSan on real weakly-ordered hardware other
      # than the developer's own machine, which is the reason the leg exists.
      # ADCE_REPEAT re-runs each profile's BINARY, build untouched. 1 on push and
      # pull_request so the gate stays as fast as it is today; 10 on the nightly,
      # where a couple of extra minutes buys a real hunt.
      #
      # 10 is derived, not round. On 2-core CI the harness has executed roughly
      # 15 times with one phase-race failure, so p is about 0.067 per execution.
      # The repeat covers three profiles, so 10 repeats is 30 executions and
      # about 87% detection in one night -- which compounds to over 99% across
      # three nights, at half the runtime of 20. For a recurring job the
      # cumulative figure is the one that matters, not the per-night one.
      - name: verify.sh (strict, asan+ubsan, tsan)
        env:
          CC: clang
          ADCE_REPEAT: ${{ github.event_name == 'schedule' && '10' || '1' }}
        run: ./scripts/verify.sh

  shipping-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # New dependency, and what it is for: verify-linux-gcc.sh builds both
      # linux/amd64 and linux/arm64. On this x86_64 host the amd64 leg is now
      # NATIVE -- the point of this workflow -- while the arm64 leg needs binfmt
      # handlers registered to run at all. This action installs them. It
      # replaces nothing; on the development machine Docker Desktop provides the
      # same registration automatically, which is why the script needs no change
      # to work in both places.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Toolchain
        run: |
          uname -srm
          docker --version
          docker run --rm gcc:14 gcc --version | head -1

      - name: verify-linux-gcc.sh (linux/arm64 + linux/amd64)
        run: ./scripts/verify-linux-gcc.sh
