# Native x86_64 verification.
#
# The gap this closes is recorded in CLAUDE.md: "no real x86_64 hardware has run
# this code." Every green result before this workflow came from native arm64 or
# from qemu-emulated amd64, and emulation proves compilation and test outcomes
# while proving nothing about timing or memory-model behaviour. x86_64 is where
# the seqlock actually ships.
#
# Neither gate script is modified to run here. verify.sh already honours CC, and
# the only CI-specific need -- binfmt registration so the shipping-target gate
# can still reach linux/arm64 from an x86_64 host -- is a workflow step. A gate
# change would have to be proposed on its own, per CLAUDE.md.

name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly, because repeated execution is what finds the bugs this project
  # actually has. The phase race in the harness survived four green runs and
  # surfaced only when a 2-core runner widened the window; TSan could not have
  # caught it, since a phase-accounting race is not a data race. Sampling the
  # scheduler repeatedly is the mechanism that works on that class.
  #
  # Off the hour on purpose: GitHub queues scheduled workflows hardest at :00,
  # and a nightly that starts late is a nightly whose result arrives late.
  schedule:
    - cron: "17 4 * * *"

  # On demand, because the nightly is not re-runnable in the sense that matters.
  # ADCE_REPEAT=10 is otherwise reachable only by waiting for 04:17 UTC, and if
  # that run goes red there is no way to ask for another one -- re-running the
  # failed job re-runs it with the schedule's context, but nothing lets you hunt
  # harder, or hunt now, against a suspect commit.
  #
  # The default is the HUNTING value, not the fast one. A manual dispatch is a
  # deliberate act; nobody reaches for this button wanting the same single pass
  # that every push already ran. The per-edit and push paths keep their 1 by
  # falling through the expression below.
  workflow_dispatch:
    inputs:
      repeat:
        description: "ADCE_REPEAT -- times each profile's binary is re-run"
        required: false
        default: "10"

# A superseded push should not keep burning a runner; the newest commit is the
# only one whose result anyone acts on.
#
# Keyed on the EVENT as well as the ref. Without that, every trigger for one ref
# shares a group, and a workflow_dispatch cancels the push run it lands beside --
# which happened: run 33771705510 (push, 916c8c0) was cancelled 21 seconds in by a
# dispatch that arrived three seconds after it. That instance was harmless because
# both ran the same SHA, and the dispatch verified it more thoroughly than the
# push would have.
#
# What the old grouping could have hidden is the case where the SHAs DIFFER. Push
# a commit, dispatch a run while it is still going, and the dispatch -- which
# checks out whatever the ref points at when IT starts, not what the push carried
# -- cancels the only run that was verifying the pushed commit. The record then
# shows a green dispatch and a cancelled push for the same ref, and a commit that
# nothing actually verified reads as covered. Cancelled runs are easy to skim past
# precisely because they are not failures.
#
# Splitting by event keeps the original intent -- a newer push still cancels an
# older push, a newer dispatch an older dispatch -- while letting the two kinds
# coexist.
concurrency:
  group: verify-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sanitizers:
    # Both architectures, identical steps, so any divergence between them is
    # attributable to the machine rather than to the workflow.
    #
    # arm64 is not a nice-to-have second opinion here, it is the STRICTER test.
    # CLAUDE.md makes the local target the host architecture precisely because
    # x86_64's TSO hides missing barriers that a weakly-ordered target exposes:
    # code that passes on arm64 passes on x86_64, and the reverse does not hold.
    # That made arm64 the authoritative concurrency evidence in this project
    # while it ran on exactly one laptop. The qemu arm64 leg in
    # verify-linux-gcc.sh does not substitute for it -- emulation proves
    # compilation, not memory ordering.
    #
    # Both images pinned, not ubuntu-latest. A gate whose toolchain moves under
    # it stops meaning what it meant, and this one is load-bearing evidence
    # about a memory model.
    strategy:
      # The whole point is comparing the two, so one going red must not cancel
      # the other and destroy the comparison.
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # These runners default vm.mmap_rnd_bits high enough that LLVM's
      # sanitizer runtimes cannot map their shadow regions against that much
      # ASLR entropy, and abort at startup before a single test runs. Lowering
      # it is the standard workaround and affects only this runner's entropy,
      # not the code under test. Deliberately not tolerated with `|| true`: a
      # sysctl that silently fails would leave the sanitizers to abort later
      # with a much less obvious message.
      - name: Widen sanitizer address space
        run: sudo sysctl -w vm.mmap_rnd_bits=28

      # Recorded before the gate runs, so a green result is attributable to a
      # named toolchain rather than to whatever the image happened to carry.
      # The two runners need not ship the same clang, and if they diverge that
      # is worth seeing rather than assuming parity.
      - name: Toolchain
        run: |
          uname -srm
          cc --version | head -1
          clang --version | head -1
          echo "nproc: $(nproc)"

      # CC=clang deliberately. verify.sh is the sanitizer gate and runs clang
      # locally on macOS, so keeping clang here means the CI result and the
      # local result are the same gate on a different machine, rather than two
      # different gates. GCC is covered by the shipping-target job below.
      #
      # On the arm64 runner this is TSan on real weakly-ordered hardware other
      # than the developer's own machine, which is the reason the leg exists.
      # ADCE_REPEAT re-runs each profile's BINARY, build untouched. 1 on push and
      # pull_request so the gate stays as fast as it is today; 10 on the nightly,
      # where a couple of extra minutes buys a real hunt, and whatever the
      # dispatcher asked for on a manual run.
      #
      # inputs.repeat is the empty string on every event that is not a dispatch,
      # and GitHub treats '' as falsy, so the || chain falls through to the
      # event-based default. A malformed result cannot go unnoticed: verify.sh
      # rejects an empty or non-numeric ADCE_REPEAT before it builds anything,
      # which is precisely the failure mode that validation was written for.
      #
      # 10 is derived, not round. On 2-core CI the harness has executed roughly
      # 15 times with one phase-race failure, so p is about 0.067 per execution.
      # The repeat covers three profiles, so 10 repeats is 30 executions and
      # about 87% detection in one night -- which compounds to over 99% across
      # three nights, at half the runtime of 20. For a recurring job the
      # cumulative figure is the one that matters, not the per-night one.
      - name: verify.sh (strict, asan+ubsan, tsan)
        env:
          CC: clang
          ADCE_REPEAT: ${{ inputs.repeat || (github.event_name == 'schedule' && '10' || '1') }}
        run: ./scripts/verify.sh

  shipping-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # New dependency, and what it is for: verify-linux-gcc.sh builds both
      # linux/amd64 and linux/arm64. On this x86_64 host the amd64 leg is now
      # NATIVE -- the point of this workflow -- while the arm64 leg needs binfmt
      # handlers registered to run at all. This action installs them. It
      # replaces nothing; on the development machine Docker Desktop provides the
      # same registration automatically, which is why the script needs no change
      # to work in both places.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Toolchain
        run: |
          uname -srm
          docker --version
          docker run --rm gcc:14 gcc --version | head -1

      - name: verify-linux-gcc.sh (linux/arm64 + linux/amd64)
        run: ./scripts/verify-linux-gcc.sh

  # ===========================================================================
  # THE BOUNDARY NOTE. Proposed, not proven -- read the risk paragraph below
  # before trusting it.
  #
  # WHAT IT CHECKS. A pull request that changes any src/*.c or test/*.c must
  # either change CLAUDE.md too, or say in a commit message that it did not move
  # a boundary.
  #
  # WHY IT EXISTS. The unverified list in CLAUDE.md has gone stale in the
  # UNDER-claiming direction three times: entry (1) across #10-#13, entry (2)
  # after #16, and the loop case table after #20. The cause is mechanical rather
  # than inattentive. #16 and #20 each touched test files ONLY, with CLAUDE.md
  # untouched in both, so the commit that moved the boundary and the commit that
  # recorded the move landed in different pull requests and the list was wrong
  # for the whole window between them -- days, not minutes. Care cannot close
  # that window: whoever moved the boundary has already merged and gone.
  #
  # WHY A COMMIT MESSAGE AND NOT THE PR BODY. The escape has to be countable
  # later, and countable from the repository alone. Merged commit messages are
  # greppable with `git log --grep` and, since the ruleset forbids
  # non_fast_forward, cannot be rewritten afterwards. A pull request body is
  # editable after merge and reachable only through the API. The evaluation
  # below depends on counting escapes, so the escape lives where counting works.
  #
  # THE UNMEASURED RISK, stated rather than buried. Its false-positive rate is
  # UNKNOWN. What is known is the frequency, measured retrospectively over this
  # repository's whole history: of 24 merges to main that touched src/*.c or
  # test/*.c, **17 would have fired**. Of those 17, the number that had a
  # boundary worth recording is not determinable mechanically -- it is a
  # judgement about each change -- and the three confirmed stale-list instances
  # are the only true positives this project can point to. So the firing rate is
  # 71% against a demonstrated true-positive count of 3.
  #
  # That ratio is NOT a false-positive rate, and reading it as one would
  # overstate the case against this check. The cost of a firing is not a red
  # build; it is a forced decision, and one of the two answers is a single line
  # of text. But the ratio is exactly the shape this project has already ruled
  # dangerous: a check that fires on most changes gets answered by reflex, the
  # escape line becomes a paste, and a gate answered by reflex is a ritual. This
  # project records that a silently-skipping profile is worse than one that does
  # not exist; a gate escaped by habit is the same defect wearing a green tick.
  #
  # THE EVALUATION, fixed in advance so the result cannot be chosen afterwards.
  # After TEN pull requests subject to this check, count the escape uses:
  #
  #     git log --grep='no boundary change' --oneline main
  #
  # If that count is high -- most of the ten -- the check is a ritual and must be
  # REMOVED, with the removal recorded as a negative result in CLAUDE.md the way
  # the printed-universal grep audit was. It is not to be kept because removing
  # it would look like retreat. If the count is low and the list stayed current,
  # it earned its place and the ruleset should be updated to require it.
  #
  # NOT REQUIRED BY THE RULESET, and this is a real gap rather than an oversight.
  # The ruleset on main requires exactly three contexts -- sanitizers
  # (ubuntu-24.04), sanitizers (ubuntu-24.04-arm), shipping-target -- so this job
  # shows red without blocking a merge. An advisory red is the mirror image of
  # the CodeRabbit tick this project already documents: that one passes green
  # having reviewed nothing, this one fails red having stopped nothing. Adding it
  # to the ruleset is a separate, deliberate act and is NOT done here, because a
  # check whose false-positive rate is unmeasured should not be able to block a
  # merge on its first day.
  # ===========================================================================
  boundary-note:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Both endpoints of the range must be present, so no shallow clone.
          fetch-depth: 0

      - name: Boundary note
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          code="$(printf '%s\n' "$changed" | grep -E '^(src|test)/.*\.c$' || true)"
          if [ -z "$code" ]; then
              echo "No src/*.c or test/*.c changed. Nothing to ask about."
              exit 0
          fi

          echo "Code files changed in this pull request:"
          printf '  %s\n' $code

          if printf '%s\n' "$changed" | grep -qx 'CLAUDE.md'; then
              echo
              echo "CLAUDE.md changed too. The record moved with the code."
              exit 0
          fi

          # The escape. Searched across every commit message in the range,
          # -i because the phrase is a sentence and not a token.
          if git log --format='%B' "$BASE_SHA".."$HEAD_SHA" \
                 | grep -qi 'no boundary change'; then
              echo
              echo "ESCAPE USED: a commit in this range says 'no boundary change'."
              echo "This is one tally mark against the check. See the evaluation"
              echo "criterion in .github/workflows/verify.yml."
              exit 0
          fi

          echo
          echo "FAIL: this pull request changes src/*.c or test/*.c and leaves"
          echo "      CLAUDE.md untouched."
          echo
          echo "The unverified list has gone stale in the under-claiming direction"
          echo "three times, and both #16 and #20 had exactly this shape: test files"
          echo "only, CLAUDE.md untouched, the record catching up in a later PR."
          echo
          echo "Two ways past this, and both are correct answers:"
          echo
          echo "  1. Update CLAUDE.md in its OWN COMMIT inside this pull request."
          echo "     CLAUDE.md is not a gate -- it checks nothing and blocks"
          echo "     nothing -- so the own-commit rule is satisfied by a separate"
          echo "     commit in the same PR, and that is what closes the window."
          echo
          echo "  2. If nothing this PR does moves a boundary the list describes,"
          echo "     say so in a commit message: 'no boundary change: <reason>'."
          echo "     Each use is counted against this check when it is evaluated."
          exit 1
